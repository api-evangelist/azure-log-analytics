specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Azure Log Analytics
providerId: azure-log-analytics
created: '2026-05-04'
modified: '2026-05-05'
reconciled: true
tags:
  - Observability
  - Logs
  - Monitoring
  - SIEM
  - Analytics
description: Log Analytics (the data backend for Azure Monitor) is priced by ingested-data volume (per-GB)
  with a Pay-As-You-Go tier and tiered Commitment plans (100 GB/day through 5,000 GB/day) that discount
  the per-GB rate. Data retention is 31 days free; longer interactive retention and long-term Archive
  (up to 12 years) are billed separately. Basic Logs and Auxiliary Logs offer cheaper ingest for high-volume,
  low-query-frequency tables. Search and restore-from-archive carry separate per-GB-scanned charges.
sources:
  - https://azure.microsoft.com/en-us/pricing/details/monitor/
  - https://learn.microsoft.com/en-us/azure/azure-monitor/logs/cost-logs
  - https://learn.microsoft.com/en-us/azure/azure-monitor/fundamentals/service-limits
plans:
  - id: azure-log-analytics-pay-as-you-go
    name: Pay-As-You-Go
    type: usage-based
    description: Per-GB ingest with no daily cap. 31 days interactive retention free; longer retention
      billed separately.
    entries:
      - label: Analytics Logs ingest (PAYG)
        name: ingest_payg
        type: metered
        metric: GB
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: see Azure Monitor pricing page
        userMultiplied: false
      - label: Interactive retention (>31 days)
        name: retention
        type: metered
        metric: GB-month
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: see Azure Monitor pricing page
        userMultiplied: false
      - label: Long-term archive
        name: archive
        type: metered
        metric: GB-month
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: see Azure Monitor pricing page
        userMultiplied: false
    elements:
      - name: KQL queries
      - name: Up to 730 days interactive retention
      - name: Up to 12 years archive
  - id: azure-log-analytics-commitment
    name: Commitment Tiers
    type: subscription
    description: Daily-volume commitments (100, 200, 300, 400, 500, 1000, 2000, 5000 GB/day) with discounts
      up to ~30% off PAYG. Overages are charged at the same effective rate.
    entries:
      - label: 100 GB/day commitment
        name: commit_100
        type: subscription
        metric: GB-day
        limit: 100
        timeFrame: day
        geo: global
        unit: 1
        price: see Azure Monitor pricing page (~15% off PAYG)
        userMultiplied: false
      - label: 200 / 300 / 400 / 500 GB/day commitment
        name: commit_mid
        type: subscription
        metric: GB-day
        limit: 500
        timeFrame: day
        geo: global
        unit: 1
        price: see Azure Monitor pricing page
        userMultiplied: false
      - label: 1000 / 2000 / 5000 GB/day commitment
        name: commit_high
        type: subscription
        metric: GB-day
        limit: 5000
        timeFrame: day
        geo: global
        unit: 1
        price: see Azure Monitor pricing page (~30% off PAYG at 5000 GB/day)
        userMultiplied: false
    elements:
      - name: Tiered ingest discount
      - name: 31-day cancellation
      - name: Overage billed at same effective rate
  - id: azure-log-analytics-basic-aux
    name: Basic and Auxiliary Logs
    type: usage-based
    description: Lower-cost ingest for high-volume tables that are queried infrequently. Search and restore
      carry per-GB-scanned charges.
    entries:
      - label: Basic Logs ingest
        name: basic_ingest
        type: metered
        metric: GB
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: see Azure Monitor pricing page (cheaper than Analytics)
        userMultiplied: false
      - label: Auxiliary Logs ingest
        name: aux_ingest
        type: metered
        metric: GB
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: see Azure Monitor pricing page (cheapest tier)
        userMultiplied: false
      - label: Search / scan
        name: search
        type: metered
        metric: GB
        limit: -1
        timeFrame: usage
        geo: global
        unit: 1
        price: see Azure Monitor pricing page
        userMultiplied: false
    elements:
      - name: 8-day default retention
      - name: Single-table ad-hoc queries
      - name: Restore to Analytics for KQL access
  - id: azure-log-analytics-legacy-free
    name: Legacy Free Tier (closed)
    type: freemium
    description: 500 MB/day ingest, 7-day retention. New workspaces could only be created through July
      2022.
    entries:
      - label: Free ingest cap
        name: free_cap
        type: quota
        metric: MB
        limit: 500
        timeFrame: day
        geo: global
        unit: 1
        price: '0.00'
        userMultiplied: false
    elements:
      - name: 500 MB/day cap
      - name: 7-day retention
      - name: Closed to new workspaces
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
