      - table
  - name: long_term_archive
    description: Long-term archive storage up to 12 years
    unit: GB-month
    aggregation: avg
    dimensions:
      - workspace
      - table
  - name: search_scan
    description: Per-GB scanned by Basic/Auxiliary search and archive restore
    unit: GB
    aggregation: sum
    dimensions:
      - workspace
      - table
principles:
  - name: Visibility
    description: Use the Usage and Estimated Costs blade in the workspace and Azure Cost Management
      to see ingest by table and Solutions; build Workbooks for ingest trend by source.
  - name: Allocation
    description: Use one workspace per business unit / environment for clean attribution; tag workspaces;
      use Resource Context RBAC and table-level access for chargeback.
  - name: Optimization
    description: Move high-volume / low-query tables to Basic or Auxiliary; configure table-level retention;
      drop noisy fields with ingestion-time transforms; use daily caps; commit to a tier matching steady-state
      ingest; review verbose diagnostic settings (especially AzureDiagnostics) for waste.
  - name: Accountability
    description: Set workspace daily cap alerts; assign workspace owners; review monthly per-table ingest
      growth; investigate sudden spikes for misconfigured logging.
