description: 'FOCUS-aligned FinOps for Azure Log Analytics: per-GB ingest is the dominant meter, with
  daily-commit tiers, table-tier optimization (Analytics vs Basic vs Auxiliary), retention beyond 31
  days, and search/restore from archive as additional billable lines. Ingest tier and table choice are
  the primary cost levers.'
